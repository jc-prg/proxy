server {
    server_name ${SERVER_NAME};
    listen 80;
    return 301 https://${D}host${D}request_uri;
}

#-----------------------------------------------------

server {
    server_name ${SERVER_NAME};
    listen 443 ssl;
    http2 on;

    ssl_certificate           /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header                Strict-Transport-Security "max-age=31536000" always;

    limit_req                 zone=perip burst=100 nodelay;
    limit_conn                connperip 50;

    client_max_body_size      513m;

    proxy_redirect            off;
    proxy_http_version        1.1;
    proxy_hide_header         X-Powered-By;
    proxy_set_header          Host ${D}host;
    proxy_set_header          X-Real-IP ${D}remote_addr;
    proxy_set_header          X-Forwarded-For ${D}remote_addr;
    proxy_set_header          X-Forwarded-Proto ${D}scheme;
    proxy_set_header          X-Forwarded-Host ${D}host;
    proxy_set_header          X-Scheme ${D}scheme;
    proxy_set_header          Upgrade ${D}http_upgrade;
    proxy_set_header          Connection ${D}connection_upgrade;
    proxy_connect_timeout     5;
    proxy_read_timeout        240;
    proxy_intercept_errors    on;
${SERVER_EXTRA}
    location /                {
                                proxy_pass    http://${SERVER_FORWARD};
                                }
}
