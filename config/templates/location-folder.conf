    location = ${LOCATION_PATH} {
                                return        301 ${LOCATION_PATH}/;
                                }

    location ${LOCATION_PATH}/ {
                                set           ${D}fwd_prefix ${LOCATION_PATH};
                                proxy_pass    http://${SERVER_FORWARD}/;
                                proxy_redirect default;
                                proxy_redirect / ${LOCATION_PATH}/;
                                proxy_cookie_path / ${LOCATION_PATH}/;
                                }
