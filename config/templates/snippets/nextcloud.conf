    # F-12: Nextcloud-Version (status.php, capabilities) nur fuer Nextcloud-Clients
    # und Anfragen mit Cookie/Login ausliefern, sonst 404 (map in nginx/nginx.conf)
    location ~* ^/(status\.php|ocs/v[12]\.php/cloud/capabilities) {
                                if (${D}nc_version_allowed = 0) { return 404; }
                                proxy_pass    http://${SERVER_FORWARD};
                                }
