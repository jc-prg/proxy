#--------------------------------------------
# jc://proxy/
#--------------------------------------------
# values are read from .env by docker compose
#--------------------------------------------

services:

# PROXY
#--------------------------------------------

  proxy:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER}
    restart: always
    ports:
      - 80:80
      - 443:443

    volumes:
      - ${LETSENCRYPT_SSL}:/etc/letsencrypt:ro
      - ${NGINX_DOMAINS}:/etc/nginx/conf.d:ro
      - ${NGINX_CONFIG}:/etc/nginx/nginx.conf:ro
      - ${NGINX_PAGES:-./config/pages}:/usr/share/nginx/pages:ro

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
